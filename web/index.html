    <title>LanguageLab</title>
    <!-- Telegram's Mini App bridge: defines window.Telegram.WebApp, carrying the signed launch
         parameters when the page was opened from the bot and an empty initData anywhere else.
         Telegram requires it in <head>, before the app, and updates the file in place without
         publishing a hash — so no integrity attribute: a pinned one would break the bridge on
         their next release. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
